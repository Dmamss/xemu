name: Build Steam Deck Custom (SCDA)

on:
  workflow_dispatch:
  push:
    branches:
      - claude/xemu-steam-deck-custom-kRMqL

jobs:
  build:
    name: Build xemu Steam Deck (x86_64)
    runs-on: ubuntu-22.04

    env:
      ARTIFACT_NAME: xemu-steamdeck-scda
      CCACHE_DIR: /tmp/xemu-ccache
      CCACHE_MAXSIZE: 512M

    steps:
    - name: Checkout source (with submodules)
      uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Cache ccache
      uses: actions/cache@v5
      with:
        path: ${{ env.CCACHE_DIR }}
        key: steamdeck-ccache-${{ github.sha }}
        restore-keys: steamdeck-ccache-

    - name: Install build dependencies
      run: |
        sudo apt-get -qy update
        sudo apt-get -qy install ccache
        sudo apt-get -qy build-dep .

    - name: Setup ccache
      run: |
        mkdir -p ${CCACHE_DIR}
        ccache -z

    - name: Configure & Compile
      run: |
        # Delegate entirely to build-steamdeck.sh so CI and local builds
        # always use identical flags (-O3, LTO, AVX2, Zen 2 tuning).
        # ccache is injected via CC/CXX; AR/RANLIB use the GCC plugin wrappers
        # required for LTO bitcode preservation.
        export CC="ccache gcc"
        export CXX="ccache g++"
        export AR="gcc-ar"
        export RANLIB="gcc-ranlib"
        export CCACHE_CPP2=true
        bash build-steamdeck.sh -j$(nproc)

    - name: Package
      run: |
        mkdir -p dist
        cp build/qemu-system-i386 dist/xemu-steamdeck
        chmod +x dist/xemu-steamdeck

    - name: Generate AppImage
      env:
        VERSION: steamdeck-${{ github.sha }}
      run: |
        wget -q https://github.com/linuxdeploy/linuxdeploy/releases/latest/download/linuxdeploy-x86_64.AppImage
        chmod +x linuxdeploy-x86_64.AppImage

        mkdir -p AppDir/usr/bin
        cp dist/xemu-steamdeck AppDir/usr/bin/xemu

        mkdir -p AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps

        cat > AppDir/usr/share/applications/xemu.desktop << 'EOF'
        [Desktop Entry]
        Name=xemu (Steam Deck)
        Comment=Original Xbox Emulator - Steam Deck custom build
        Exec=xemu
        Icon=xemu
        Type=Application
        Categories=Game;Emulator;
        EOF

        if [ -f ui/icons/xemu_256x256.png ]; then
          cp ui/icons/xemu_256x256.png AppDir/usr/share/icons/hicolor/256x256/apps/xemu.png
        fi

        VERSION="${{ env.VERSION }}" ./linuxdeploy-x86_64.AppImage \
          --appdir AppDir \
          --output appimage

        mv xemu*.AppImage dist/

    - name: Report ccache stats
      run: ccache -s

    - name: Upload AppImage
      uses: actions/upload-artifact@v6
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: dist/xemu*.AppImage
        compression-level: 0
        retention-days: 30
