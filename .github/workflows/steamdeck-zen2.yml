name: Steam Deck Zen 2 Build

# Independent workflow – does not call any upstream reusable workflow.
# Produces a Zen 2-optimised AppImage for Steam Deck LCD (AMD Van Gogh / znver2).
#
# Optimisation rationale:
#   -march=znver2 : enables AVX2, AES-NI, SHA, BMI1/2, CLZERO, RDPID → tighter
#                   audio-mixing and rendering hot-paths → reduces jitter in the
#                   APU throttle loop that drives overall emulation pacing.
#   -mtune=znver2 : pipeline / branch-predictor tuning for Zen 2 cores.
#   Thin LTO      : cross-module inlining between the vblank path and renderer.

on:
  push:
    branches:
      - claude/steam-deck-zen2-build-Ho7Bp
  workflow_dispatch:

concurrency:
  group: steamdeck-zen2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1 – Create source tarball (mirrors build.yml "source" job exactly)
  # ──────────────────────────────────────────────────────────────────────────
  source:
    name: Create source package
    runs-on: ubuntu-latest
    outputs:
      pkg_version: ${{ steps.version.outputs.pkg_version }}
    steps:
    - name: Clone tree
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: sudo apt-get install -y meson

    - name: Determine release version
      id: version
      run: |
        if TAG=$(git describe --tags --match 'v*' 2>/dev/null); then
          echo "pkg_version=${TAG#v}" >> $GITHUB_OUTPUT
        else
          SHORT_HASH=$(git rev-parse --short HEAD)
          echo "pkg_version=0.0.0-0-unofficial-${SHORT_HASH}" >> $GITHUB_OUTPUT
        fi

    - name: Create source package
      id: package
      run: |
        pkg_name="xemu-${{ steps.version.outputs.pkg_version }}"
        tar_filename="${pkg_name}.tar"
        tar_prefix="./${pkg_name}/"
        ./scripts/archive-source.sh ${tar_filename} ${tar_prefix}

        echo -n ${{ github.sha }} > XEMU_COMMIT
        echo -n ${{ steps.version.outputs.pkg_version }} > XEMU_VERSION
        tar -r --file "${tar_filename}" --transform "s,^./,${tar_prefix}," ./XEMU_COMMIT ./XEMU_VERSION

        zstd "${tar_filename}"
        echo "pkg_filename=${tar_filename}.zst" >> $GITHUB_OUTPUT

    - name: Upload source package artifact
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v4
      with:
        name: src
        path: ${{ steps.package.outputs.pkg_filename }}
        compression-level: 0

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2 – Build x86_64 release AppImage with Zen 2 flags
  # ──────────────────────────────────────────────────────────────────────────
  build-steamdeck:
    name: Build (x86_64, release, znver2)
    needs: source
    runs-on: ubuntu-22.04
    env:
      ARTIFACT_NAME: xemu-steamdeck-zen2
      CCACHE_DIR: /tmp/xemu-ccache
      CCACHE_MAXSIZE: 512M
      LTO_CACHE_DIR: /tmp/xemu-lto-cache
      LTO_CACHE_MAXSIZE: 512m
      # Disable Debian-managed LTO – handled manually via meson options below.
      DEB_BUILD_MAINT_OPTIONS: optimize=-lto
      # Zen 2 / Steam Deck optimisation flags injected into the Debian build.
      DEB_CFLAGS_MAINT_APPEND: -gdwarf-4 -gstrict-dwarf -march=znver2 -mtune=znver2
      DEB_CXXFLAGS_MAINT_APPEND: -gdwarf-4 -gstrict-dwarf -march=znver2 -mtune=znver2
      DEB_LDFLAGS_MAINT_APPEND: -Wl,--build-id=sha1
      CC: ccache clang-21
      CXX: ccache clang++-21
      CC_LD: lld-21
      CXX_LD: lld-21
      AR: llvm-ar-21
      RANLIB: llvm-ranlib-21
      NM: llvm-nm-21

    steps:
    - name: Setup build options (release + Thin LTO)
      run: |
        mkdir -p ${LTO_CACHE_DIR}
        opts=(
          --extra-ldflags="-Wl,--thinlto-cache-policy=cache_size_bytes=$LTO_CACHE_MAXSIZE"
          -Db_lto=true
          -Db_lto_mode=thin
          -Db_thinlto_cache=true
          -Db_thinlto_cache_dir="$LTO_CACHE_DIR"
        )
        echo "XEMU_BUILD_OPTIONS=${opts[*]}" >> "$GITHUB_ENV"

    - name: Initialize compiler cache
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v4
      with:
        path: |
          ${{ env.CCACHE_DIR }}
          ${{ env.LTO_CACHE_DIR }}
        key: cache-steamdeck-zen2-${{ github.sha }}
        restore-keys: cache-steamdeck-zen2-

    - name: Download source package
      uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v4
      with:
        name: src

    - name: Extract source package
      run: |
        mkdir src
        tar -xf xemu-${{ needs.source.outputs.pkg_version }}.tar.zst -C src --strip-components=2

    - name: Create debian changelog
      run: |
        pushd src
        echo -e "\
        xemu (1:0.0.0-0) unstable; urgency=medium\n\
          Built from ${{ needs.source.outputs.pkg_version }} – Steam Deck Zen 2)\n\
         -- dmamss  $(date -R)" > debian/changelog
        popd

    - name: Add LLVM APT repository
      run: |
        sudo install -d /etc/apt/keyrings
        curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
          | sudo gpg --dearmor -o /etc/apt/keyrings/llvm.gpg
        sudo tee /etc/apt/sources.list.d/llvm.list <<EOF
        deb [signed-by=/etc/apt/keyrings/llvm.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-21 main
        deb-src [signed-by=/etc/apt/keyrings/llvm.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-21 main
        EOF

    - name: Install dependencies
      run: |
        sudo apt-get -qy update
        sudo apt-get install -y ccache libfuse2 libusb-1.0-0-dev
        pushd src
        sudo apt-get -qy build-dep .
        popd

    - name: Install LLVM 21
      shell: bash
      env:
        ARCH: amd64
        POOL: https://apt.llvm.org/jammy/pool/main/l/llvm-toolchain-21/
      run: |
        set -euxo pipefail

        HTML="$(curl -fsSL --compressed "$POOL")"
        VER="$(grep -oE 'libllvm21_[0-9][^"]+_${{ env.ARCH }}\.deb' <<<"$HTML" | head -n1 \
          | sed -E 's/^libllvm21_//; s/_${{ env.ARCH }}\.deb$//')"
        echo "Using pool version: $VER"

        mkdir -p /tmp/llvm21 && cd /tmp/llvm21

        fetch() {
          local pkg="$1"
          local file="${pkg}_${VER}_${{ env.ARCH }}.deb"
          curl -fsSLO "${POOL}${file}"
        }

        for pkg in \
          clang-21 clang-tools-21 lld-21 \
          libllvm21 libclang-cpp21 libclang-common-21-dev libclang1-21 libclang-rt-21-dev \
          llvm-21 llvm-21-dev llvm-21-linker-tools llvm-21-runtime llvm-21-tools
        do
          fetch "$pkg"
        done

        sudo apt-get install -y --no-install-recommends ./*.deb

    - name: Setup ccache
      run: |
        echo "PATH=/usr/lib/ccache:$PATH" >> "$GITHUB_ENV"
        mkdir -p ${CCACHE_DIR}
        ccache -z

    - name: Compile
      run: |
        # dpkg-genbuildinfo takes ~2 min on GH runners – disable it.
        sudo rm /usr/bin/dpkg-genbuildinfo
        sudo ln -s /bin/true /usr/bin/dpkg-genbuildinfo

        pushd src
        dpkg-buildpackage --no-sign -b
        popd

        mkdir -p deb
        mv *.deb *.ddeb deb/ 2>/dev/null || true

    - name: Report ccache stats
      run: ccache -s

    - name: Generate AppImage
      env:
        VERSION: ${{ needs.source.outputs.pkg_version }}-steamdeck-zen2
      run: |
        wget --no-verbose \
          https://github.com/linuxdeploy/linuxdeploy/releases/latest/download/linuxdeploy-x86_64.AppImage
        chmod +x linuxdeploy-x86_64.AppImage

        ar x deb/*.deb
        mkdir appimage
        tar -C appimage -xf data.tar*
        install -DT src/xemu.metainfo.xml appimage/usr/share/metainfo/xemu.metainfo.xml

        ./linuxdeploy-x86_64.AppImage --output appimage --appdir appimage

        # Rename to include the zen2 marker
        for f in xemu-*.AppImage; do
          mv "$f" "xemu-${VERSION}.AppImage"
        done

    - name: Upload AppImage artifact
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v4
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: "*.AppImage"
        compression-level: 0
